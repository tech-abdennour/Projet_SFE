version: "3.9"

services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html
      - ./python:/app
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      php:
        condition: service_started
      python_api:
        condition: service_healthy
    networks:
      - appnet

  php:
    build: ./php
    container_name: php
    restart: unless-stopped
    volumes:
      - ./app:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - appnet

  mysql:
    image: mariadb:10.11
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  python_api:
    build: ./python
    container_name: python_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./python:/app
      - ./python/Donnee_parametres:/app/Donnee_parametres
      - ./python/service/analysis_exports:/app/service/analysis_exports
      - ./python/service/data:/app/service/data
      - ./python/service/models:/app/service/models
      - ./python/service/graphe:/app/service/graphe
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet

volumes:
  mysql_data:

networks:
  appnet:
    driver: bridge